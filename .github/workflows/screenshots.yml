name: Browser screenshots
on:
  push:
    paths:
      - 'public/**'
      - 'server.py'
      - 'scripts/browser_screenshots.py'
      - 'requirements-browser.txt'
      - '.github/workflows/screenshots.yml'
  pull_request:
    paths:
      - 'public/**'
      - 'server.py'
      - 'scripts/browser_screenshots.py'
      - 'requirements-browser.txt'
      - '.github/workflows/screenshots.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements-browser.txt
      - run: python -m playwright install --with-deps chromium
      - name: Install Chinese fonts
        run: sudo apt-get install -y fonts-noto-cjk
      - name: Capture and verify application in Chromium
        run: python scripts/browser_screenshots.py --output-dir test-results
      - name: Upload screenshots and verification record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tongping-browser-screenshots
          path: test-results/
          if-no-files-found: warn
          retention-days: 30
